name: eLibrary Automated Regression & E2E Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start eLibrary Web App
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project-id.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_token_for_ci_build"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run start &
          npx wait-on -t 120000 http://localhost:3000

      - name: Run TestNG Suite via Maven
        run: |
          mvn clean test -Dheadless=true -DbaseUrl="http://localhost:3000"

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7
