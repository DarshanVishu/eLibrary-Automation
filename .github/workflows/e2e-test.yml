name: eLibrary Automated Regression & E2E Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Test Automation Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone and Start eLibrary Web App
        run: |
          git clone https://github.com/DarshanVishu/eLibrary-Web.git app
          cd app
          npm install
          npm run build
          npm run start &
          npx wait-on -t 120000 http://localhost:3000

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run TestNG Suite via Maven
        run: mvn clean test -Dheadless=true

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7