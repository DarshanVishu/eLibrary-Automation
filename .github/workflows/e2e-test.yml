name: eLibrary Automated Regression & E2E Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Base URL (e.g., https://your-app.vercel.app)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run TestNG Suite via Maven
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.target_env }}" ]; then
            mvn clean test -Dheadless=true -DtestFailureIgnore=true -DbaseUrl="${{ github.event.inputs.target_env }}" || true
          else
            mvn clean test -Dheadless=true -DtestFailureIgnore=true || true
          fi

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7