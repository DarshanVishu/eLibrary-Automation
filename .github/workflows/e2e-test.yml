name: eLibrary Automated Regression & E2E Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase
        run: |
          cd frontend
          supabase start

      - name: Start eLibrary Web App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$(cd .. && cd frontend && supabase status -o json | jq -r .ANON_KEY) \
          npm run build
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$(cd .. && cd frontend && supabase status -o json | jq -r .ANON_KEY) \
          npm run start &
          npx wait-on -t 120000 http://localhost:3000

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run TestNG Suite via Maven
        run: mvn clean test -Dheadless=true -DapiUrl="http://127.0.0.1:54321"

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7