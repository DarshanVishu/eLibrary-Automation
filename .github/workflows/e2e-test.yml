name: eLibrary Automated Regression & E2E Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Containers & Seed DB
        working-directory: frontend
        run: |
          supabase start
          # Export local API URL and Keys to GitHub Environment
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV

      - name: Start eLibrary Web App
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_NAME: "e-library"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run start &
          npx wait-on -t 120000 http://localhost:3000

      - name: Run TestNG Suite via Maven
        run: |
          mvn clean test -Dheadless=true -DbaseUrl="http://localhost:3000"

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7
